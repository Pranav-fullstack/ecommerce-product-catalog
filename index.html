<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Northstar Market — explore thoughtfully selected everyday essentials, tech, and lifestyle products.">
  <meta name="theme-color" content="#101827">
  <title>Northstar Market — Curated essentials</title>
  <link rel="preload" href="styles.min.css" as="style">
  <link rel="stylesheet" href="styles.min.css">
  <script src="app.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Northstar Market home"><span class="brand-mark" aria-hidden="true">✳</span> northstar<span class="brand-light">market</span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#/" data-nav="home">Shop</a>
      <a href="#/about" data-nav="about">Our story</a>
    </nav>
    <div class="header-actions">
      <label class="search-box">
        <span class="sr-only">Search products</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        <input id="search" type="search" placeholder="Search products…" autocomplete="off">
      </label>
      <button class="cart-button" id="cart-open" type="button" aria-label="Open shopping cart">Cart <span id="cart-count" class="cart-count">0</span></button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="app" aria-live="polite" aria-busy="false"></div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a class="brand footer-brand" href="#/">✳ northstar<span class="brand-light">market</span></a>
      <p>Good things for everyday living.</p>
      <p>© <span id="year">2026</span> Northstar Market. Demo storefront.</p>
    </div>
  </footer>

  <dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title">
    <div class="dialog-head">
      <div><p class="eyebrow">YOUR SELECTION</p><h2 id="cart-title">Shopping cart</h2></div>
      <button class="icon-button" id="cart-close" type="button" aria-label="Close shopping cart">×</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-bottom">
      <div class="total-row"><span>Subtotal</span><strong id="cart-total">$0.00</strong></div>
      <p class="muted small">Shipping and taxes calculated at checkout. Demo only; no payment is collected.</p>
      <button class="button button-primary full-width" id="checkout" type="button">Continue to checkout</button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
